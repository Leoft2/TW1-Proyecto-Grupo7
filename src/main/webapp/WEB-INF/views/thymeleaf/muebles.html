<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Muebles')}"></head>

<body>
  <nav th:replace="~{fragments/layout :: navbar('ambientes')}"></nav>

  <main class="container">
    <header class="hb-page-header">
      <div>
        <span class="hb-eyebrow">Inventario</span>
        <h1>Muebles</h1>
        <p>
          Muebles pertenecientes al ambiente
          <span th:text="${ambiente.tipoDeAmbiente.nombre}">Habitación</span>.
        </p>
      </div>
      <a th:href="@{/muebles/crear}" class="btn btn-lg btn-primary"><i class="bi bi-plus-lg"></i> Agregar mueble</a>
    </header>

    <div class="card">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th scope="col" class="ps-4">Mueble</th>
              <th scope="col">Medidas</th>
              <th scope="col" class="text-end pe-4"><span class="visually-hidden">Acciones</span></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="mueble : ${muebles}">
              <td class="ps-4 fw-semibold" th:text="${mueble.nombre}">Cama</td>
              <td>
                <span class="hb-chip" th:if="${mueble.ancho != null and mueble.largo != null}"
                  th:text="${mueble.ancho} + ' m x ' + ${mueble.largo} + ' m'">2.0 m x 1.6 m</span>
                <span class="hb-chip" th:unless="${mueble.ancho != null and mueble.largo != null}">Sin medidas</span>
              </td>
              <td class="text-end pe-4">
                <a th:href="@{/mueble/{id}(id=${mueble.id})}" class="btn btn-sm btn-secondary">Detalle</a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(muebles)}">
              <td colspan="3" class="ps-4 text-secondary">Este ambiente todavía no tiene muebles cargados.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <a th:href="@{/ambientes/{id}(id=${ambiente.id})}" class="btn btn-secondary mt-4"><i class="bi bi-arrow-left"></i> Volver al ambiente</a>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
