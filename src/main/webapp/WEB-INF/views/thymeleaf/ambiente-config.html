<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Definición espacial')}"></head>

<body>
  <nav th:replace="~{fragments/layout :: navbar('ambientes')}"></nav>

  <main class="container">
    <header class="hb-page-header">
      <div>
        <span class="hb-eyebrow">Distribución automática</span>
        <h1>Definición espacial</h1>
        <p>Cargá las medidas del ambiente y sus muebles para generar el plano.</p>
      </div>
    </header>

    <ol class="list-group list-group-horizontal-md mb-4">
      <li class="list-group-item active fw-semibold">1 · Espacio</li>
      <li class="list-group-item">2 · Muebles</li>
      <li class="list-group-item">3 · Plano</li>
      <li class="list-group-item disabled">4 · Presupuesto</li>
      <li class="list-group-item disabled">5 · Resumen</li>
    </ol>

      <form th:action="@{/inventario-muebles}" method="get">

        <fieldset class="mb-4">
          <legend class="h5">Dimensiones del ambiente</legend>

          <div class="row row-cols-1 row-cols-md-2 g-3">
            <div class="col">
              <label for="ancho" class="form-label">Ancho (m)</label>
              <input type="number" step="0.1" min="0" class="form-control" id="ancho"
                name="ancho" value="4" required>
            </div>
            <div class="col">
              <label for="largo" class="form-label">Largo (m)</label>
              <input type="number" step="0.1" min="0" class="form-control" id="largo"
                name="largo" value="3" required>
            </div>
          </div>
        </fieldset>

        <hr>

        <a th:href="@{/ambientes}" class="btn btn-secondary">Atrás</a>
        <button type="submit" class="btn btn-primary">Siguiente →</button>

      </form>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>

  <script type="module" th:src="@{/js/dimensiones.js}"></script>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
