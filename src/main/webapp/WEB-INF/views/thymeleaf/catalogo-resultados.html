<!--
  Fragmento con los resultados del catálogo.

  Se incluye dentro de catalogo.html y además se devuelve solo (sin navbar ni
  footer) en /catalogo/resultados, para que el JS pueda reemplazar los
  resultados en el lugar cuando cambia un filtro, sin recargar la página.
-->
<div th:fragment="resultados" id="hb-resultados">

  <div class="hb-catalogo-barra">
    <h2 class="hb-catalogo-titulo">Muebles encontrados</h2>
    <span class="hb-contador"
      th:text="|${totalMuebles} ${totalMuebles == 1 ? 'mueble' : 'muebles'}|">3 muebles</span>
  </div>

  <div class="hb-filtros-activos" data-filtros-activos hidden></div>

  <div th:if="${#lists.isEmpty(muebles)}" class="hb-catalogo-vacio">
    <i class="bi bi-search"></i>
    <h3>No encontramos muebles con esos filtros</h3>
    <p>Probá con otros estilos, ambientes o precios.</p>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-xxl-3 g-4" th:unless="${#lists.isEmpty(muebles)}">
    <div th:each="mueble : ${muebles}" class="col">
      <article class="card h-100 hb-card-mueble hb-card-hover" th:id="${'mueble-' + mueble.id}">
        <div class="card-body d-flex flex-column">
          <div class="d-flex flex-wrap gap-2 mb-3">
            <span class="hb-chip hb-chip-salvia" th:text="${mueble.estilo}">Retro</span>
            <span class="hb-chip hb-chip-primario"
              th:text="${mueble.categoriaDeMueble?.nombre ?: 'Sin categoría'}">Sillón</span>
          </div>

          <h3 class="h5 mb-1" th:text="${mueble.nombre}">Sillón Retró</h3>
          <p class="text-secondary hb-card-mueble-descripcion" th:text="${mueble.descripcion}">
            Sillón de voluteadas tapizado en terciopelo color mostaza.
          </p>

          <div class="d-flex justify-content-between align-items-center mt-auto pt-3">
            <strong class="hb-precio"
              th:text="${'$ ' + #numbers.formatDecimal(mueble.precio, 1, 'COMMA', 0, 'POINT')}">$ 85.000</strong>
            <a th:href="@{/mueble/{id}(id=${mueble.id})}" class="btn btn-outline-primary btn-sm">
              Ver detalle
            </a>
          </div>

          <div th:if="${session.ROL == 'ADMIN'}" class="d-flex gap-2 mt-3">
            <a th:href="@{/muebles/editar/{id}(id=${mueble.id})}" class="btn btn-sm btn-secondary w-50">
              <i class="bi bi-pencil"></i> Editar
            </a>
            <form th:action="@{/muebles/eliminar/{id}(id=${mueble.id})}" method="post" class="w-50"
              data-confirmar-eliminacion>
              <button type="submit" class="btn btn-sm btn-danger w-100"><i class="bi bi-trash"></i> Eliminar</button>
            </form>
          </div>
        </div>
      </article>
    </div>
  </div>

</div>
