<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${ambiente.tipoDeAmbiente.nombre})}"></head>

<body>
  <nav th:replace="~{fragments/layout :: navbar('ambientes')}"></nav>

  <main class="container">
    <header class="hb-page-header">
      <div>
        <span class="hb-eyebrow">Ambiente</span>
        <h1 th:text="${ambiente.tipoDeAmbiente.nombre}">Habitación</h1>
        <p>Acá podés ver, editar y rediseñar este ambiente.</p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <a th:href="@{/ambientes/{id}/muebles(id=${ambiente.id})}" class="btn btn-lg btn-secondary"><i class="bi bi-pencil"></i> Ver / editar muebles</a>
        <a th:href="@{/ambientes/{id}/redisenar(id=${ambiente.id})}" class="btn btn-lg btn-primary"><i class="bi bi-magic"></i> Rediseñar</a>
      </div>
    </header>

    <div class="card">
      <div class="card-body">
        <h2 class="h5 mb-3">Información</h2>
        <dl class="hb-datos">
          <dt>Tipo</dt>
          <dd th:text="${ambiente.tipoDeAmbiente.nombre}">Dormitorio</dd>
          <dt>Dimensiones</dt>
          <dd th:text="${#numbers.formatDecimal(ambiente.ancho, 1, 0) + 'm x ' + #numbers.formatDecimal(ambiente.largo, 1, 0) + 'm'}">4m x 3m</dd>
        </dl>
      </div>
    </div>

    <h2 class="hb-section-title">Muebles</h2>
    <div class="card">
      <div class="card-body">
        <p class="text-secondary">Muebles cargados en este ambiente.</p>
        <ul th:if="${!#lists.isEmpty(ambiente.muebles)}" class="list-unstyled hb-lista-muebles">
          <li th:each="mueble : ${ambiente.muebles}">
            <i class="bi bi-diamond-fill"></i>
            <a th:href="@{/mueble/{id}(id=${mueble.id})}" th:text="${mueble.nombre}">Cama</a>
          </li>
        </ul>
        <p th:if="${#lists.isEmpty(ambiente.muebles)}" class="text-secondary mb-0">Este ambiente todavía no tiene muebles.</p>
      </div>
    </div>

    <a th:href="@{/ambientes}" class="btn btn-secondary mt-4"><i class="bi bi-arrow-left"></i> Volver</a>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
