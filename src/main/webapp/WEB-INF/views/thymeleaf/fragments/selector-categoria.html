<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<select th:fragment="selector(campo, seleccionada)" th:name="${campo}" class="form-select" data-categoria
  aria-label="Categoría del mueble">
  <option value="" th:selected="${seleccionada == null}">Sin categoría</option>
  <option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nombre}"
    th:attr="data-ancho=${categoria.anchoPromedio},data-profundidad=${categoria.profundidadPromedio}"
    th:selected="${categoria.id == seleccionada}">Cama doble</option>
</select>
</body>
</html>
